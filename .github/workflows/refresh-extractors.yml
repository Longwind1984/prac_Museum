name: Refresh extractors (Met / Smithsonian / CMA)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 1 * *"  # 1st of each month, 05:00 UTC

permissions:
  contents: write

concurrency:
  group: refresh-extractors
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch upstream dumps
        run: |
          set -euo pipefail
          mkdir -p /tmp
          echo "::group::Cleveland Museum of Art CC0 dump"
          curl -sS --max-time 600 -o cma.json \
            "https://openaccess-api.clevelandart.org/artworks/?cc0=1&limit=1000&skip=0" \
            || true
          # The above is a paginated endpoint; for a true full dump use the
          # Cleveland-published S3 mirror or the daily CSV. Keep the live API
          # call as a smoke test; if size < 1 MB fall back to the GitHub mirror.
          if [ "$(wc -c < cma.json)" -lt 1000000 ]; then
            echo "Live API returned <1MB, fetching Cleveland's static dump"
            curl -sSL --max-time 600 -o cma.json \
              "https://openaccess-api.clevelandart.org/artworks/"
          fi
          ls -lh cma.json
          echo "::endgroup::"

          echo "::group::Met Objects CSV"
          curl -sSL --max-time 600 -o /tmp/MetObjects.csv \
            "https://media.githubusercontent.com/media/metmuseum/openaccess/master/MetObjects.csv"
          ls -lh /tmp/MetObjects.csv
          echo "::endgroup::"

      - name: Run extractors
        run: |
          set -euo pipefail
          python data/sources/scripts/extract_cma.py
          python data/sources/scripts/extract_met.py /tmp/MetObjects.csv
          python data/sources/scripts/extract_smithsonian_fsg.py

      - name: Show stats
        run: |
          ls -lh data/sources/*.json
          python - <<'PY'
          import json
          for s in ['cma','met','smithsonian_fsg']:
              p = f'data/sources/{s}.json'
              d = json.load(open(p))
              items = [r for r in d if isinstance(r,dict) and r.get('source')==s]
              with_img = sum(1 for r in items if r.get('image_urls'))
              print(f'{s:25} {len(items):>6} records  {with_img:>6} with image URLs')
          PY

      - name: Commit & push
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain data/sources/*.json)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources/*.json
          git commit \
            -m "data: refresh extractor outputs" \
            -m "Triggered by: ${{ github.event_name }}" \
            -m "Includes: CMA / Met / Smithsonian FSG"
          git push
