name: Download museum images (CC0/PD)

# =============================================================================
# FROZEN — 2026-05-17 · Curator + Critic 双签
# -----------------------------------------------------------------------------
# 本工作流当前处于「冻结」状态。Critic 在 2026-05-17 boot-selfcheck review 中
# 判定:已下 4,466 张图 / demo 切片实际仅需 ~88 张,利用率 1.97%。继续全量
# 下载属于「过早投资」(Curator 宪法 §否决理由 4)。
#
# 后续触发规则:
#   1. 必须由「30 件展品对照件清单」驱动,定向跑(用 source + dynasty 过滤);
#   2. 单次 ≤ 200 张;
#   3. 重启自动触发(cron / push)前需 Curator 重签 + Critic 复查。
#
# 当前状态:
#   - push 触发已禁用(注释保留,日后重启时改回即可)
#   - workflow_dispatch 仍可用(为应对 P0 修复 / 单件补图)
#   - 默认 limit 从 5000 改为 200(强制走小批量)
#
# 参考:
#   - agents/pm-critic/reviews/2026-05-17-boot-selfcheck.md(主要问题 #1 / 修 1)
#   - commit 4e81375 提出的「再下 10,000 张」意图已撤回
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Records per source to download (default 200, hard cap 200 per Critic redirect)"
        default: "200"
        required: false
      source:
        description: "Single source: cma | smithsonian_fsg | met (blank=all)"
        required: false
      dynasty:
        description: "Filter by dynasty_en, e.g. Northern Qi (blank=all)"
        required: false
  # --- push 触发已冻结,2026-05-17 起停止自动跑 ----------------------------
  # push:
  #   branches:
  #     - claude/install-superpower-plugin-bh2Mg
  #   paths:
  #     - "data/sources/cma.json"
  #     - "data/sources/met.json"
  #     - "data/sources/smithsonian_fsg.json"
  #     - "data/sources/scripts/download_images.py"
  # ------------------------------------------------------------------------

permissions:
  contents: write

concurrency:
  group: download-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download:
    if: "!contains(github.event.head_commit.message, '[skip-images]')"
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compute args
        id: args
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          [ -z "$LIMIT" ] && LIMIT=200
          # Hard cap: refuse any limit > 200 while frozen (Critic redirect 2026-05-17)
          if [ "$LIMIT" -gt 200 ]; then
            echo "::error::limit=$LIMIT exceeds the 200-per-run cap set by 2026-05-17 Critic redirect."
            echo "::error::To raise the cap, get Curator re-signoff and update download-images.yml header."
            exit 1
          fi
          SOURCE="${{ github.event.inputs.source }}"
          DYNASTY="${{ github.event.inputs.dynasty }}"
          # rate-limit 0.3 matches script default; concurrency already provides spacing
          ARGS="--limit-per-source $LIMIT --rate-limit 0.3"
          [ -n "$SOURCE" ] && ARGS="$ARGS --source $SOURCE"
          [ -n "$DYNASTY" ] && ARGS="$ARGS --dynasty \"$DYNASTY\""
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "Computed args: $ARGS"

      - name: Download images
        run: |
          set -euo pipefail
          eval python data/sources/scripts/download_images.py ${{ steps.args.outputs.args }}

      - name: Show what was added
        run: |
          du -sh data/sources/images/ || true
          find data/sources/images -type f -name '*.jpg' | wc -l
          ls data/sources/images/ 2>/dev/null || true

      - name: Commit & push
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain data/sources/images/)" ]; then
            echo "No new images to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources/images/
          ADDED=$(git diff --cached --numstat data/sources/images/ | wc -l)
          git commit \
            -m "data: download $ADDED museum images via Actions [skip-images]" \
            -m "Triggered by: ${{ github.event_name }}" \
            -m "Args: ${{ steps.args.outputs.args }}"
          git push
