<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<title>一起看 · 首博 · v4(极简 · AI 不在)· 2026-05-18</title>
<style>
:root {
  --bg: #000000;        /* 纯黑 — v4 黑屏哲学 */
  --bg-card: #0a0907;
  --panel: #12100c;
  --ink: #e8e2d4;
  --dim: #6a655a;
  --faint: #2a2620;
  --line: #1c1a14;
  --gold: #c9a96b;
  --gold-dim: #6e5d3a;
  --rust: #8a4a2d;
  --safe-top: env(safe-area-inset-top);
  --safe-bottom: env(safe-area-inset-bottom);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
textarea, input { user-select: text; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 16px; line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  overflow: hidden;
}
body { width: 100vw; height: 100vh; height: 100dvh; position: relative; }

/* =====================
   BLACKOUT MODE(默认)
   ===================== */
#blackout {
  position: fixed; inset: 0;
  background: #000;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
  z-index: 1;
}
.breath-dot {
  width: 1px; height: 1px;
  background: var(--gold);
  border-radius: 50%;
  box-shadow: 0 0 8px 1px rgba(201,169,107,0.18);
  position: absolute;
  bottom: calc(80px + var(--safe-bottom));
  left: 50%; transform: translateX(-50%);
  animation: breath 4.2s ease-in-out infinite;
  cursor: pointer;
  /* expand tap target without visual change */
  padding: 30px;
  margin: -30px;
}
@keyframes breath {
  0%, 100% { opacity: 0.4; box-shadow: 0 0 6px 1px rgba(201,169,107,0.12); }
  50% { opacity: 1; box-shadow: 0 0 12px 2px rgba(201,169,107,0.28); }
}
.breath-hint {
  position: absolute;
  bottom: calc(30px + var(--safe-bottom));
  left: 50%; transform: translateX(-50%);
  font-size: 9px; color: var(--faint);
  letter-spacing: 0.3em; text-transform: uppercase;
  opacity: 0; transition: opacity 1s ease;
  pointer-events: none;
}
.breath-hint.show { opacity: 1; }
.peek-time {
  position: absolute;
  bottom: calc(150px + var(--safe-bottom));
  left: 50%; transform: translateX(-50%);
  color: var(--gold-dim);
  font-size: 11px; letter-spacing: 0.18em;
  font-variant-numeric: tabular-nums;
  opacity: 0; transition: opacity 0.6s ease;
  pointer-events: none;
  text-align: center; white-space: nowrap;
}
.peek-time.show { opacity: 1; }
.peek-time strong { color: var(--gold); font-weight: 500; }

/* small hidden gesture: triple-tap top to open dogfood export */
.dev-hit {
  position: absolute;
  top: 0; left: 0; right: 0; height: calc(var(--safe-top) + 40px);
  z-index: 2; opacity: 0;
}

/* =====================
   TOUCHPOINT MODE
   ===================== */
#touchpoint {
  position: fixed; inset: 0;
  background: var(--bg);
  z-index: 5;
  display: none;
  flex-direction: column;
  padding: calc(var(--safe-top) + 24px) 22px calc(var(--safe-bottom) + 24px);
  overflow-y: auto;
}
#touchpoint.show { display: flex; }
.tp-meta {
  font-size: 10px; letter-spacing: 0.2em;
  color: var(--dim); text-transform: uppercase;
  margin-bottom: 6px;
}
.tp-time { color: var(--gold-dim); font-size: 13px; font-variant-numeric: tabular-nums; margin-bottom: 22px; }

.ai-speak {
  background: var(--bg-card);
  border-left: 3px solid var(--gold);
  border-radius: 0 6px 6px 0;
  padding: 22px 22px 22px 24px;
  margin: 4px 0 28px;
  font-family: "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC", Georgia, serif;
  font-size: 18px; line-height: 1.82;
  animation: tpFadeIn 0.8s ease-out;
}
@keyframes tpFadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.ai-speak p { margin: 0 0 14px; }
.ai-speak p:last-child { margin-bottom: 0; }
.ai-speak strong { color: var(--gold); font-weight: 600; }

.sys-text {
  margin: 0 0 24px;
  color: var(--ink); font-size: 15.5px; line-height: 1.78;
  animation: tpFadeIn 0.8s ease-out 0.2s both;
}
.sys-text p { margin: 0 0 12px; }
.sys-text p:last-child { margin-bottom: 0; }
.sys-text strong { color: var(--gold); font-weight: 600; }

.tp-action {
  margin: 8px 0 18px;
  color: var(--ink); font-size: 15px; line-height: 1.7;
  animation: tpFadeIn 0.8s ease-out 0.3s both;
}
.tp-action strong { color: var(--gold); font-weight: 600; }

textarea.note {
  width: 100%; min-height: 90px;
  background: var(--bg-card); color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px;
  padding: 14px 14px;
  font-family: inherit; font-size: 15px; line-height: 1.65;
  resize: vertical; -webkit-appearance: none;
  margin: 8px 0 0;
  animation: tpFadeIn 0.8s ease-out 0.4s both;
}
textarea.note:focus { outline: none; border-color: var(--gold-dim); }
textarea.note::placeholder { color: var(--faint); }

.done-row {
  margin-top: auto;
  padding-top: 32px;
  display: flex; justify-content: center;
}
.done-btn {
  padding: 14px 32px;
  background: transparent;
  border: 1px solid var(--gold-dim);
  border-radius: 100px;
  color: var(--gold); font-size: 14px;
  letter-spacing: 0.16em;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}
.done-btn:active { background: var(--panel); border-color: var(--gold); }

/* =====================
   POSTSCRIPT MODE
   滑动条 12 卡:今天我克制住没说的事
   ===================== */
#postscript {
  position: fixed; inset: 0;
  background: var(--bg);
  z-index: 5; display: none;
}
#postscript.show { display: flex; flex-direction: column; }
.ps-header {
  padding: calc(var(--safe-top) + 24px) 22px 16px;
}
.ps-title {
  font-family: "Songti SC", serif;
  color: var(--gold); font-size: 20px; font-weight: 500;
  margin: 0 0 8px;
  letter-spacing: 0.02em;
}
.ps-sub {
  color: var(--dim); font-size: 12px;
  letter-spacing: 0.05em; line-height: 1.6;
}
/* faint anchor as background — Innovator R3 #2 */
.ps-anchor-bg {
  position: absolute;
  top: calc(var(--safe-top) + 14px);
  right: 22px; left: 22px;
  font-family: "Songti SC", serif;
  font-size: 14px; color: var(--ink);
  opacity: 0.06;
  pointer-events: none;
  text-align: right;
  white-space: pre-wrap;
  letter-spacing: 0.01em;
  max-height: 80px; overflow: hidden;
  font-style: normal;
}
.ps-scroll {
  flex: 1;
  display: flex;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  padding: 20px 0 30px;
  scrollbar-width: none;
}
.ps-scroll::-webkit-scrollbar { display: none; }
.ps-card {
  flex-shrink: 0;
  width: 86vw; max-width: 480px;
  margin: 0 12px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 28px 24px;
  scroll-snap-align: center;
  display: flex; flex-direction: column;
}
.ps-card:first-child { margin-left: 22px; }
.ps-card:last-child { margin-right: 22px; }
.ps-card-idx {
  font-size: 10px; letter-spacing: 0.2em;
  color: var(--gold-dim); text-transform: uppercase;
  margin-bottom: 14px;
}
.ps-card-title {
  font-family: "Songti SC", serif;
  font-size: 16px; color: var(--gold);
  margin-bottom: 14px; font-weight: 500;
}
.ps-card-body {
  font-size: 14.5px; line-height: 1.75;
  color: var(--ink);
}
.ps-card-body strong { color: var(--gold); font-weight: 600; }
.ps-card.final {
  background: transparent;
  border: 1px dashed var(--gold-dim);
  text-align: center;
  justify-content: center; align-items: center;
}
.ps-card.final .ps-card-title {
  font-size: 18px; margin-bottom: 22px;
}
.ps-card.final .ps-card-body { font-size: 14px; color: var(--dim); margin-bottom: 28px; }
.close-btn {
  padding: 12px 28px;
  background: transparent;
  border: 1px solid var(--gold);
  border-radius: 100px;
  color: var(--gold); font-size: 13px;
  letter-spacing: 0.18em;
  cursor: pointer; font-family: inherit;
}
.ps-dots {
  display: flex; gap: 6px;
  padding: 10px 0 calc(20px + var(--safe-bottom));
  justify-content: center;
}
.ps-dot {
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--faint);
  transition: background 0.3s, transform 0.3s;
}
.ps-dot.seen { background: var(--gold-dim); }
.ps-dot.active { background: var(--gold); transform: scale(1.5); }

/* =====================
   CLOSED MODE
   ===================== */
#closed {
  position: fixed; inset: 0;
  background: #000; z-index: 5;
  display: none;
  align-items: center; justify-content: center;
  flex-direction: column;
  padding: 40px;
}
#closed.show { display: flex; }
#closed h2 {
  font-family: "Songti SC", serif;
  font-size: 22px; color: var(--gold);
  margin: 0 0 28px; font-weight: 400;
  letter-spacing: 0.05em;
}
#closed p { color: var(--dim); font-size: 13px; text-align: center; max-width: 280px; margin: 6px 0; }

/* =====================
   DEV EXPORT (triple-tap top)
   ===================== */
#export {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.96); z-index: 100;
  display: none; flex-direction: column;
  padding: calc(var(--safe-top) + 16px) 16px calc(16px + var(--safe-bottom));
}
#export.show { display: flex; }
#export-head {
  display: flex; align-items: center; gap: 14px; margin-bottom: 14px;
}
#export-head h2 { font-family: "Songti SC", serif; font-size: 17px; color: var(--gold); margin: 0; flex: 1; }
#export textarea {
  flex: 1; width: 100%;
  background: var(--bg-card); color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px;
  padding: 14px;
  font-family: ui-monospace, monospace;
  font-size: 12px; line-height: 1.55;
  resize: none;
}
.export-actions { display: flex; gap: 10px; margin-top: 12px; }
.export-btn {
  flex: 1; padding: 12px;
  background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px;
  font-size: 13px; cursor: pointer; font-family: inherit;
}
.export-btn.primary { background: var(--gold); color: #1a1610; border-color: var(--gold); font-weight: 600; }
.tap {
  width: 34px; height: 34px;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border: 1px solid var(--line);
  border-radius: 17px; color: var(--ink);
  cursor: pointer; font-size: 14px;
}
</style>
</head>

<script>
(() => {
'use strict';

/* ===============================================================
   v4 · 极简 · AI 不在

   - 完成 5 触点后,进入 PS 滑动条(12 张:今天克制住没说的事)
   - 滑到底 → app 自我关闭(显示"明晚见。")
   - dogfood export 隐藏:连击顶部 3 次唤起
   =============================================================== */

const TPS = [
  {
    id: 'pre',
    label: '出发前',

    sys: `<p>「玉米·黄金·美洲豹」是首博 2026 开馆以来最大特展,128 元票。<strong>商业大展的策展立场会受票务和合作博弈影响。</strong></p>
<p>布局:5000 美洲 + 5000 中国 + 5000 沉浸。<strong>并置不是中性</strong>。</p>
<p>今天盯 <strong>3 件</strong>深看。其余漫游。</p>`,
    action: `<p>下面写下 <strong>1 个</strong>你脑里浮现的关于玛雅 / 印加 / 安第斯的画面。一句话。</p>`,

const state = {
  idx: 0, // next touchpoint to open

  notes: {}, // id -> { text, ts }

  closed: false, // app closed?
};
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(KEY); if (!raw) return;
    const d = JSON.parse(raw);
    state.idx = d.idx || 0;
    state.anchor = d.anchor || '';
    state.notes = d.notes || {};
    state.completed = d.completed || {};
    state.postscript = d.postscript || false;
    state.closed = d.closed || false;
  } catch (e) {}
}
load();

// ===== Mode switch =====
function setMode(mode) {
  document.getElementById('blackout').style.display = mode === 'blackout' ? 'flex' : 'none';
  document.getElementById('touchpoint').classList.toggle('show', mode === 'touchpoint');
  document.getElementById('postscript').classList.toggle('show', mode === 'postscript');
  document.getElementById('closed').classList.toggle('show', mode === 'closed');
}

// ===== Time parsing =====
function nowHHMM() {
  const d = new Date();
  return d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0');
}
function isPastSuggested(suggestedHHMM) {
  if (!suggestedHHMM) return true;
  const [sh, sm] = suggestedHHMM.split(':').map(Number);
  const d = new Date();
  const cur = d.getHours() * 60 + d.getMinutes();
  return cur >= (sh * 60 + sm);
}

// ===== Blackout interactions =====
const $dot = document.getElementById('breath-dot');
const $hint = document.getElementById('breath-hint');
const $peek = document.getElementById('peek-time');
let pressTimer = null;
let pressedAt = 0;
let didLongPress = false;

function showBreathHint() {
  $hint.classList.add('show');
  setTimeout(() => $hint.classList.remove('show'), 2500);
}

function getNextHint() {
  if (state.postscript) return null;
  if (state.closed) return null;
  const tp = TPS[state.idx];
  if (!tp) return null;
  // show: next touchpoint suggested time + tap hint
  if (tp.suggestedTs && !isPastSuggested(tp.suggestedTs)) {
    return `约 <strong>${tp.suggestedTs}</strong> · ${tp.label}`;
  }
  return `<strong>${tp.label}</strong> 已可进 · 短按金点`;
}

function showPeek() {
  const txt = getNextHint();
  if (!txt) {
    $peek.innerHTML = '今天的触点都过完了。';
  } else {
    $peek.innerHTML = txt;
  }
  $peek.classList.add('show');
  setTimeout(() => $peek.classList.remove('show'), 4000);
}

$dot.addEventListener('pointerdown', (e) => {
  pressedAt = Date.now();
  didLongPress = false;
  pressTimer = setTimeout(() => {
    didLongPress = true;
    showPeek();
  }, 1500);
});
$dot.addEventListener('pointerup', (e) => {
  clearTimeout(pressTimer);
  const elapsed = Date.now() - pressedAt;
  if (!didLongPress && elapsed < 1500) {
    // short tap → try to enter next touchpoint
    if (state.closed) return;
    if (state.postscript) {
      setMode('postscript');
      renderPS();
      return;
    }
    const tp = TPS[state.idx];
    if (!tp) {
      // shouldn't happen but handle
      state.postscript = true; save(); setMode('postscript'); renderPS();
      return;
    }
    if (tp.suggestedTs && !isPastSuggested(tp.suggestedTs)) {
      // not yet — show peek instead
      showPeek();
      return;
    }
    // enter touchpoint
    renderTouchpoint(tp);
    setMode('touchpoint');
  }
});
$dot.addEventListener('pointerleave', () => { clearTimeout(pressTimer); });

// Show breath-hint occasionally so user knows long-press exists
let firstVisit = !localStorage.getItem(KEY + '-hinted');
if (firstVisit) {
  setTimeout(() => { showBreathHint(); localStorage.setItem(KEY + '-hinted', '1'); }, 1200);
}

// ===== Touchpoint render =====
const $tp = document.getElementById('touchpoint');
function renderTouchpoint(tp) {
  $tp.innerHTML = '';
  const meta = document.createElement('div');
  meta.className = 'tp-meta';
  meta.textContent = tp.label;
  $tp.appendChild(meta);

  const time = document.createElement('div');
  time.className = 'tp-time';
  time.textContent = tp.time;
  $tp.appendChild(time);

  if (tp.sys) {
    const s = document.createElement('div');
    s.className = 'sys-text';
    s.innerHTML = tp.sys;
    $tp.appendChild(s);
  }

  if (tp.ai) {
    const a = document.createElement('div');
    a.className = 'ai-speak';
    a.innerHTML = tp.ai;
    $tp.appendChild(a);
  }

  if (tp.action) {
    const ac = document.createElement('div');
    ac.className = 'tp-action';
    ac.innerHTML = tp.action;
    $tp.appendChild(ac);
  }

  const ta = document.createElement('textarea');
  ta.className = 'note';
  ta.placeholder = tp.askPlaceholder || '随便写。';
  if (!state.notes[tp.id]) state.notes[tp.id] = { text: '' };
  ta.value = (tp.anchor === 'set' && state.anchor) ? state.anchor : (state.notes[tp.id].text || '');
  ta.addEventListener('input', () => {
    state.notes[tp.id] = { text: ta.value, ts: Date.now() };
    if (tp.anchor === 'set') state.anchor = ta.value;
    save();
  });
  $tp.appendChild(ta);

  const row = document.createElement('div');
  row.className = 'done-row';
  const btn = document.createElement('button');
  btn.className = 'done-btn';
  btn.textContent = state.idx === TPS.length - 1 ? '完成 · 进入 PS' : '我看完了 · 关 app';
  btn.addEventListener('click', () => {
    state.completed[tp.id] = true;
    state.idx = state.idx + 1;
    if (state.idx >= TPS.length) {
      state.postscript = true;
      save();
      setMode('postscript');
      renderPS();
    } else {
      save();
      setMode('blackout');
    }
  });
  row.appendChild(btn);
  $tp.appendChild(row);

  // also expose next hint at bottom (very small)
  if (tp.next) {
    const hint = document.createElement('div');
    hint.style.cssText = 'margin: 20px 0 0; color: var(--faint); font-size: 11px; text-align: center; letter-spacing: 0.15em; line-height: 1.7;';
    hint.innerHTML = `下次:<strong style="color: var(--gold-dim);">${tp.next.suggestedTime}</strong><br/>${tp.next.hint}`;
    $tp.appendChild(hint);
  }

  $tp.scrollTop = 0;
}

// ===== Postscript render =====
const $ps = document.getElementById('ps-scroll');
const $psDots = document.getElementById('ps-dots');
const $psAnchor = document.getElementById('ps-anchor');

function renderPS() {
  $psAnchor.textContent = state.anchor || '';
  $ps.innerHTML = '';
  $psDots.innerHTML = '';
  PS_CARDS.forEach((c, i) => {
    const card = document.createElement('div');
    card.className = 'ps-card';
    card.innerHTML = `
      <div class="ps-card-idx">${i+1} / ${PS_CARDS.length + 1}</div>
      <div class="ps-card-title">${c.title}</div>
      <div class="ps-card-body">${c.body}</div>
    `;
    $ps.appendChild(card);

    const dot = document.createElement('div');
    dot.className = 'ps-dot' + (i === 0 ? ' active' : '');
    dot.dataset.idx = i;
    $psDots.appendChild(dot);
  });
  // final card
  const finalCard = document.createElement('div');
  finalCard.className = 'ps-card final';
  finalCard.innerHTML = `
    <div class="ps-card-idx">${PS_CARDS.length + 1} / ${PS_CARDS.length + 1}</div>
    <div class="ps-card-title">读完了。</div>
    <div class="ps-card-body">把 app 关掉。<br/>不要回来读笔记。</div>
    <button class="close-btn" id="ps-close">关掉</button>
  `;
  $ps.appendChild(finalCard);
  const finalDot = document.createElement('div');
  finalDot.className = 'ps-dot';
  finalDot.dataset.idx = PS_CARDS.length;
  $psDots.appendChild(finalDot);

  document.getElementById('ps-close').addEventListener('click', () => {
    state.closed = true; save();
    setMode('closed');
  });

  // sync dots on scroll
  let scrollTimer = null;
  $ps.addEventListener('scroll', () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      const cardWidth = $ps.children[0].offsetWidth + 24;
      const idx = Math.round($ps.scrollLeft / cardWidth);
      Array.from($psDots.children).forEach((d, i) => {
        d.classList.toggle('active', i === idx);
        if (i < idx) d.classList.add('seen');
      });
    }, 80);
  });
}

// ===== Initial mode =====
function bootMode() {
  if (state.closed) { setMode('closed'); return; }
  if (state.postscript) { setMode('postscript'); renderPS(); return; }
  setMode('blackout');
}
bootMode();

// ===== Hidden dev export (triple-tap top) =====
let tapCount = 0;
let tapResetTimer = null;
document.getElementById('dev-hit').addEventListener('click', () => {
  tapCount++;
  clearTimeout(tapResetTimer);
  tapResetTimer = setTimeout(() => { tapCount = 0; }, 1200);
  if (tapCount >= 3) {
    tapCount = 0;
    showExport();
  }
});

function showExport() {
  const lines = ['# 团队 · 首博 v4 dogfood · 2026-05-18', '', '**版本**:v4(极简 · AI 不在 · 黑屏默认 · 1px 呼吸金点)', ''];
  if (state.anchor.trim()) {
    lines.push('## 12:00 写下的画面', '', '> ' + state.anchor.split('\n').join('\n> '), '');
  }
  lines.push('## 5 触点笔记', '');
  TPS.forEach(tp => {
    const n = state.notes[tp.id]; if (!n?.text?.trim()) return;
    lines.push(`### ${tp.time} · ${tp.label}`, '');
    lines.push('> ' + n.text.split('\n').join('\n> '), '');
  });
  lines.push('## v4 专项反馈', '');
  lines.push('1. **1px 呼吸金点替代 status badge**:你长按过几次?短按几次?');
  lines.push('   - ');
  lines.push('2. **黑屏默认**:在博物馆里掏出手机看一片黑,你的第一反应是?(慌 / 安 / 烦)');
  lines.push('   - ');
  lines.push('3. **5 触点 vs v1 17 触点 vs v2 12 触点 vs v3 11 触点**:更少触点让你觉得是"AI 不在了"还是"AI 终于让我自己看"?');
  lines.push('   - ');
  lines.push('4. **anchor 永不 recall(只在 PS 背景图极淡铺底)**:你注意到背景的字了吗?');
  lines.push('   - ');
  lines.push('5. **PS 滑动条(12 张克制住的事)**:你滑到第几张就想关?滑完之后什么感觉?');
  lines.push('   - ');
  lines.push('6. **v4 vs v2/v3:哪个版本对你而言最像"朋友"?**');
  lines.push('   - ');
  lines.push('7. **Innovator 押注:"AI 几乎完全不在"是不是更接近同伴本质?**');
  lines.push('   - ');
  document.getElementById('export-text').value = lines.join('\n');
  document.getElementById('export').classList.add('show');
}
document.getElementById('export-close').addEventListener('click', () => {
  document.getElementById('export').classList.remove('show');
});
document.getElementById('export-copy').addEventListener('click', () => {
  const t = document.getElementById('export-text');
  t.select(); document.execCommand('copy');
  document.getElementById('export-copy').textContent = '✓ 已复制';
  setTimeout(() => document.getElementById('export-copy').textContent = '复制', 1500);
});
document.getElementById('export-download').addEventListener('click', () => {
  const blob = new Blob([document.getElementById('export-text').value], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '首博 v4 dogfood-20260518.md';
  a.click(); URL.revokeObjectURL(url);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.getElementById('export').classList.remove('show');
  }
});
})();
</script>
