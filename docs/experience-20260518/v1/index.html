<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0d0c0a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>一起看 · 首博 · 玛雅与安第斯 · 2026-05-18</title>
<style>
:root {
  --bg: #0d0c0a;
  --panel: #15140f;
  --panel-2: #1e1c15;
  --ink: #e8e2d4;
  --dim: #7a7468;
  --faint: #4a463e;
  --line: #26221b;
  --gold: #c9a96b;
  --gold-dim: #6e5d3a;
  --rust: #a35c3a;
  --safe-top: env(safe-area-inset-top);
  --safe-bottom: env(safe-area-inset-bottom);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 16px; line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
body { min-height: 100vh; min-height: 100dvh; }

/* ============ TOP BAR ============ */
header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(13,12,10,0.92);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  padding: calc(var(--safe-top) + 10px) 16px 10px;
  display: flex; align-items: center; gap: 10px;
}
.brand {
  font-size: 11px; letter-spacing: 0.18em;
  color: var(--gold); text-transform: uppercase;
  flex: 1; font-weight: 500;
}
.tap {
  width: 36px; height: 36px;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border: 1px solid var(--line);
  border-radius: 18px; color: var(--ink);
  cursor: pointer; font-size: 14px;
  transition: border-color 0.15s, color 0.15s;
}
.tap:active { border-color: var(--gold); color: var(--gold); }
.progress {
  height: 2px; background: var(--line);
  position: relative; overflow: hidden;
}
.progress-bar {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: linear-gradient(90deg, var(--gold-dim), var(--gold));
  transition: width 0.4s ease;
}

/* ============ MAIN ============ */
main {
  padding: 28px 22px 140px;
  max-width: 640px; margin: 0 auto;
}

/* phase chip */
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 10px; margin-bottom: 18px;
  border: 1px solid var(--gold-dim); border-radius: 100px;
  font-size: 11px; letter-spacing: 0.12em;
  color: var(--gold); text-transform: uppercase;
}
.chip-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--gold);
}
.phase-time {
  display: block; margin-bottom: 14px;
  color: var(--dim); font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.phase-time strong { color: var(--ink); font-weight: 500; }

/* card: AI speak */
.ai-speak {
  position: relative;
  background: var(--panel);
  border-left: 3px solid var(--gold);
  border-radius: 0 6px 6px 0;
  padding: 18px 20px 18px 22px;
  margin: 14px 0 24px;
  font-family: "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC", Georgia, serif;
  font-size: 17px;
  line-height: 1.78;
  letter-spacing: 0.01em;
}
.ai-speak-label {
  display: block;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 10px; letter-spacing: 0.2em;
  color: var(--gold-dim); text-transform: uppercase;
  margin-bottom: 10px; font-weight: 600;
}
.ai-speak p { margin: 0 0 12px; }
.ai-speak p:last-child { margin-bottom: 0; }
.ai-speak strong { color: var(--gold); font-weight: 600; }
.ai-speak em { color: var(--ink); font-style: normal; border-bottom: 1px dashed var(--gold-dim); padding-bottom: 1px; }

/* card: user action */
.user-action {
  margin: 22px 0 18px;
}
.user-action-label {
  font-size: 11px; letter-spacing: 0.18em;
  color: var(--dim); text-transform: uppercase;
  margin-bottom: 10px; font-weight: 600;
}
.user-action-body {
  font-size: 15.5px; line-height: 1.72;
  color: var(--ink);
}
.user-action-body p { margin: 0 0 10px; }
.user-action-body p:last-child { margin-bottom: 0; }
.user-action-body ul { margin: 8px 0; padding-left: 22px; }
.user-action-body li { margin-bottom: 6px; }
.user-action-body code {
  background: var(--panel-2);
  padding: 1px 6px; border-radius: 3px;
  font-family: ui-monospace, "SF Mono", monospace;
  font-size: 0.92em; color: var(--gold);
}

/* anchor recall display */
.anchor-recall {
  margin: 18px 0;
  padding: 16px 18px;
  background: var(--panel-2);
  border-left: 3px solid var(--rust);
  border-radius: 0 4px 4px 0;
}
.anchor-recall-label {
  font-size: 10px; letter-spacing: 0.2em;
  color: var(--rust); text-transform: uppercase;
  margin-bottom: 8px; font-weight: 600;
}
.anchor-recall-text {
  font-family: "Songti SC", "Source Han Serif SC", Georgia, serif;
  font-size: 16px; color: var(--ink);
  font-style: italic; white-space: pre-wrap;
}
.anchor-recall-empty {
  color: var(--faint); font-style: italic; font-size: 13px;
}

/* note area */
.note-zone {
  margin-top: 20px; padding-top: 18px;
  border-top: 1px dashed var(--line);
}
.note-zone-label {
  font-size: 11px; letter-spacing: 0.18em;
  color: var(--dim); text-transform: uppercase;
  margin-bottom: 10px; font-weight: 600;
  display: flex; align-items: center; gap: 8px;
}
.note-zone-label .saved {
  font-size: 10px; color: var(--gold); letter-spacing: 0.1em;
  opacity: 0; transition: opacity 0.3s;
}
.note-zone-label .saved.show { opacity: 1; }

textarea.note {
  width: 100%; min-height: 90px;
  background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px;
  padding: 12px 14px;
  font-family: inherit; font-size: 15px; line-height: 1.6;
  resize: vertical;
  -webkit-appearance: none;
}
textarea.note:focus {
  outline: none; border-color: var(--gold-dim);
}
textarea.note::placeholder { color: var(--faint); }

.note-tools {
  display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap;
}
.tool-btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 14px;
  background: transparent;
  border: 1px solid var(--line); border-radius: 100px;
  color: var(--dim); font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
}
.tool-btn:active, .tool-btn:hover {
  border-color: var(--gold-dim); color: var(--gold);
}
.tool-btn.recording {
  border-color: var(--rust); color: var(--rust);
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.45; }
}
.tool-btn svg { width: 14px; height: 14px; }
.tool-btn input[type=file] { display: none; }

.attachments {
  margin-top: 12px;
  display: flex; gap: 8px; flex-wrap: wrap;
}
.attach-thumb {
  width: 64px; height: 64px;
  border-radius: 4px;
  background: var(--panel-2);
  background-size: cover; background-position: center;
  border: 1px solid var(--line);
  position: relative;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.attach-thumb .x {
  position: absolute; top: -6px; right: -6px;
  background: var(--rust); color: white;
  width: 18px; height: 18px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 10px; cursor: pointer;
}
.audio-thumb {
  height: 36px; min-width: 130px;
  display: inline-flex; align-items: center;
  background: var(--panel-2); border-radius: 18px;
  padding: 0 14px; gap: 8px;
  border: 1px solid var(--line);
  color: var(--ink); font-size: 12px;
  cursor: pointer;
}
.audio-thumb.playing { border-color: var(--gold); color: var(--gold); }

/* ============ NAV BOTTOM ============ */
nav.bottom {
  position: fixed; left: 0; right: 0; bottom: 0;
  background: rgba(13,12,10,0.95);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding: 14px 16px calc(14px + var(--safe-bottom));
  display: flex; gap: 10px; align-items: center;
  z-index: 30;
}
nav.bottom .nav-btn {
  flex: 1; padding: 14px 16px;
  background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px;
  font-size: 15px; font-weight: 500;
  cursor: pointer; font-family: inherit;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
nav.bottom .nav-btn:active { background: var(--panel-2); }
nav.bottom .nav-btn.primary {
  background: var(--gold); color: #1a1610;
  border-color: var(--gold);
  font-weight: 600;
}
nav.bottom .nav-btn.primary:active { background: var(--gold-dim); }
nav.bottom .nav-btn:disabled {
  opacity: 0.3; cursor: not-allowed;
}
.nav-meta {
  text-align: center; font-size: 10px;
  color: var(--faint); letter-spacing: 0.15em;
  margin-top: 6px; padding-bottom: 4px;
}

/* ============ INTRO / OUTRO ============ */
.intro-block {
  margin: 20px 0;
  padding: 22px 22px;
  background: var(--panel);
  border-radius: 8px;
  border: 1px solid var(--line);
}
.intro-block h2 {
  font-family: "Songti SC", "Source Han Serif SC", serif;
  font-size: 21px; margin: 0 0 14px;
  color: var(--gold); font-weight: 500;
  letter-spacing: 0.04em;
}
.intro-block p {
  margin: 0 0 12px; line-height: 1.78;
  color: var(--ink);
}
.intro-block p:last-child { margin-bottom: 0; }
.intro-block strong { color: var(--gold); font-weight: 600; }

/* ============ OVERLAY: PAUSE ============ */
.pause-overlay {
  position: fixed; inset: 0;
  background: var(--bg);
  z-index: 100;
  display: none; align-items: center; justify-content: center;
  flex-direction: column; padding: 40px;
  text-align: center;
}
.pause-overlay.show { display: flex; }
.pause-overlay h2 {
  font-family: "Songti SC", serif;
  font-size: 32px; color: var(--gold);
  margin: 0 0 22px; font-weight: 400;
}
.pause-overlay p { color: var(--dim); margin: 6px 0; max-width: 320px; }
.pause-overlay .tip {
  margin-top: 36px; font-size: 11px;
  color: var(--faint); letter-spacing: 0.2em;
  text-transform: uppercase;
}

/* ============ OVERLAY: TOC ============ */
.toc-overlay {
  position: fixed; inset: 0;
  background: rgba(13,12,10,0.96);
  backdrop-filter: blur(12px);
  z-index: 90;
  display: none; flex-direction: column;
  padding: calc(var(--safe-top) + 20px) 20px calc(20px + var(--safe-bottom));
  overflow-y: auto;
}
.toc-overlay.show { display: flex; }
.toc-overlay h2 {
  font-family: "Songti SC", serif;
  font-size: 22px; color: var(--gold);
  margin: 0 0 8px; font-weight: 500;
}
.toc-overlay .toc-sub {
  font-size: 12px; color: var(--dim); margin-bottom: 24px;
  letter-spacing: 0.12em;
}
.toc-overlay .toc-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 14px; margin: 6px 0;
  background: var(--panel); border-radius: 6px;
  border: 1px solid var(--line);
  cursor: pointer;
  transition: border-color 0.15s;
}
.toc-overlay .toc-item:active { border-color: var(--gold-dim); }
.toc-overlay .toc-item.current { border-color: var(--gold); }
.toc-overlay .toc-item.has-note::after {
  content: '●'; color: var(--gold);
  font-size: 8px; align-self: center;
}
.toc-time {
  color: var(--gold); font-size: 12px; font-weight: 600;
  min-width: 52px; font-variant-numeric: tabular-nums;
  padding-top: 1px;
}
.toc-title { color: var(--ink); font-size: 14px; flex: 1; line-height: 1.5; }
.toc-close {
  position: absolute; top: calc(var(--safe-top) + 14px); right: 14px;
  width: 36px; height: 36px; border-radius: 18px;
  background: var(--panel); border: 1px solid var(--line);
  color: var(--ink); font-size: 18px;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer;
}

/* ============ OVERLAY: EXPORT ============ */
.export-overlay {
  position: fixed; inset: 0;
  background: rgba(13,12,10,0.96);
  backdrop-filter: blur(12px);
  z-index: 95;
  display: none; flex-direction: column;
  padding: calc(var(--safe-top) + 16px) 16px calc(16px + var(--safe-bottom));
}
.export-overlay.show { display: flex; }
.export-overlay h2 {
  font-family: "Songti SC", serif; font-size: 20px;
  color: var(--gold); margin: 0 0 14px;
  display: flex; align-items: center; justify-content: space-between;
}
.export-overlay textarea {
  flex: 1; width: 100%;
  background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px;
  padding: 14px;
  font-family: ui-monospace, "SF Mono", monospace;
  font-size: 12px; line-height: 1.55;
  resize: none;
}
.export-actions {
  display: flex; gap: 10px; margin-top: 12px;
}

/* skinny utility */
.muted { color: var(--dim); }
.divider {
  height: 1px; background: var(--line);
  margin: 28px 0;
}
@media (max-width: 380px) {
  .ai-speak { padding: 16px 16px 16px 18px; font-size: 16px; }
  main { padding: 24px 18px 140px; }
}
</style>
</head>
<body>

<header>

</div>

// ===== STORAGE =====
const KEY = 'yqk-shoubo-20260518';
const state = {
  idx: 0,
  notes: {}, // id -> { text, photos: [base64], audios: [{name, blobUrl}], ts }
  anchor: '',
};

function save() {
  try {
    const persist = {
      idx: state.idx,
      notes: {},
      anchor: state.anchor,
    };
    for (const id in state.notes) {
      persist.notes[id] = {
        text: state.notes[id].text || '',
        photos: state.notes[id].photos || [],
        audioCount: (state.notes[id].audios || []).length,
        ts: state.notes[id].ts,
      };
    }
    localStorage.setItem(KEY, JSON.stringify(persist));
  } catch (e) { console.warn('save failed', e); }
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    state.idx = d.idx || 0;
    state.anchor = d.anchor || '';
    state.notes = {};
    for (const id in (d.notes || {})) {
      state.notes[id] = {
        text: d.notes[id].text || '',
        photos: d.notes[id].photos || [],
        audios: [], // not persisted across reload
        ts: d.notes[id].ts,
      };
    }
  } catch (e) { console.warn('load failed', e); }
}
load();

// ===== RENDER =====
const $main = document.getElementById('main');
const $progressBar = document.getElementById('progress-bar');
const $btnPrev = document.getElementById('btn-prev');
const $btnNext = document.getElementById('btn-next');

function ensureNote(id) {
  if (!state.notes[id]) state.notes[id] = { text:'', photos:[], audios:[], ts: Date.now() };
  return state.notes[id];
}

function showSaved(el) {
  const s = el.querySelector('.saved');
  if (!s) return;
  s.classList.add('show');
  clearTimeout(s._t);
  s._t = setTimeout(() => s.classList.remove('show'), 1300);
}

function render() {
  const tp = TPS[state.idx];
  const note = ensureNote(tp.id);

  $main.innerHTML = '';

  // chip
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.innerHTML = `<span class="chip-dot"></span>${tp.chip}`;
  $main.appendChild(chip);

  // time
  const t = document.createElement('div');
  t.className = 'phase-time';
  t.innerHTML = `<strong>${tp.time}</strong> · <span class="muted">${tp.timeNote || ''}</span>`;
  $main.appendChild(t);

  // pre-arrival intro
  if (tp.intro) {
    const b = document.createElement('div');
    b.className = 'intro-block';
    b.innerHTML = `<h2>${tp.intro.title}</h2>${tp.intro.body}`;
    $main.appendChild(b);
  }

  // ai speak
  if (tp.ai) {
    const a = document.createElement('div');
    a.className = 'ai-speak';
    a.innerHTML = `<span class="ai-speak-label">🤖 ${tp.ai.label}</span>${tp.ai.body}`;
    $main.appendChild(a);
  }

  // anchor recall
  if (tp.anchor === 'recall') {
    const ar = document.createElement('div');
    ar.className = 'anchor-recall';
    const txt = state.anchor.trim();
    ar.innerHTML = `<div class="anchor-recall-label">你 12:00 写下的画面</div>` +
      (txt
        ? `<div class="anchor-recall-text">${escapeHtml(txt)}</div>`
        : `<div class="anchor-recall-empty">(你没在出发前写画面。没关系,直接答下面的问题。)</div>`);
    $main.appendChild(ar);
  }

  // user action
  if (tp.user) {
    const u = document.createElement('div');
    u.className = 'user-action';
    u.innerHTML = `<div class="user-action-label">你做的事</div><div class="user-action-body">${tp.user}</div>`;
    $main.appendChild(u);
  }

  // note zone
  const nz = document.createElement('div');
  nz.className = 'note-zone';
  nz.innerHTML = `
    <div class="note-zone-label">
      <span>记 · 仅本机保存</span>
      <span class="saved">已保存</span>
    </div>
    <textarea class="note" placeholder="${escapeAttr(tp.askPlaceholder || '随便写。')}"></textarea>
    <div class="note-tools">
      <label class="tool-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l3-3h12l3 3v13a1 1 0 01-1 1H4a1 1 0 01-1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>
        加照片
        <input type="file" accept="image/*" capture="environment" id="file-photo">
      </label>
      <button class="tool-btn" id="btn-voice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="13" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
        <span id="btn-voice-label">语音备忘</span>
      </button>
    </div>
    <div class="attachments" id="attachments"></div>
  `;
  $main.appendChild(nz);

  const $note = nz.querySelector('textarea.note');
  $note.value = note.text || '';
  if (tp.anchor === 'set' && state.anchor) $note.value = state.anchor;

  $note.addEventListener('input', () => {
    note.text = $note.value;
    note.ts = Date.now();
    if (tp.anchor === 'set') state.anchor = $note.value;
    save();
    showSaved(nz);
  });

  const $att = nz.querySelector('#attachments');
  renderAttachments($att, note, tp.id);

  nz.querySelector('#file-photo').addEventListener('change', (ev) => {
    const f = ev.target.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onload = (e) => {
      // compress to ~600px max width
      const img = new Image();
      img.onload = () => {
        const max = 600;
        const scale = Math.min(1, max / img.width, max / img.height);
        const w = img.width * scale | 0, h = img.height * scale | 0;
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.78);
        note.photos = note.photos || [];
        note.photos.push(dataUrl);
        save();
        renderAttachments($att, note, tp.id);
        showSaved(nz);
      };
      img.src = e.target.result;
    };
    fr.readAsDataURL(f);
    ev.target.value = '';
  });

  // voice
  const $vb = nz.querySelector('#btn-voice');
  const $vlabel = nz.querySelector('#btn-voice-label');
  let mediaRecorder = null;
  let chunks = [];
  $vb.addEventListener('click', async () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      chunks = [];
      mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
      mediaRecorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'audio/webm' });
        const url = URL.createObjectURL(blob);
        note.audios = note.audios || [];
        note.audios.push({ name: '录音 ' + (note.audios.length + 1), blobUrl: url, blob });
        save();
        renderAttachments($att, note, tp.id);
        $vb.classList.remove('recording');
        $vlabel.textContent = '语音备忘';
        stream.getTracks().forEach(t => t.stop());
        showSaved(nz);
      };
      mediaRecorder.start();
      $vb.classList.add('recording');
      $vlabel.textContent = '● 录音中 · 再点停止';
    } catch (e) {
      alert('麦克风权限被拒,或本浏览器不支持。可以改用手机自带录音 app,事后再补。');
    }
  });

  // progress
  $progressBar.style.width = ((state.idx + 1) / TPS.length * 100) + '%';

  // nav state
  $btnPrev.disabled = state.idx === 0;
  $btnNext.disabled = state.idx === TPS.length - 1;
  $btnNext.textContent = state.idx === TPS.length - 1 ? '完成 ✓' : '继续 →';

  window.scrollTo(0, 0);
}

function renderAttachments($el, note, tpid) {
  $el.innerHTML = '';
  (note.photos || []).forEach((dataUrl, i) => {
    const thumb = document.createElement('div');
    thumb.className = 'attach-thumb';
    thumb.style.backgroundImage = `url(${dataUrl})`;
    const x = document.createElement('span');
    x.className = 'x'; x.textContent = '×';
    x.addEventListener('click', (e) => {
      e.stopPropagation();
      note.photos.splice(i, 1);
      save();
      renderAttachments($el, note, tpid);
    });
    thumb.appendChild(x);
    $el.appendChild(thumb);
  });
  (note.audios || []).forEach((au, i) => {
    const a = document.createElement('div');
    a.className = 'audio-thumb';
    a.innerHTML = `<span>▶</span><span>${au.name}</span>`;
    let audio = null;
    a.addEventListener('click', () => {
      if (audio && !audio.paused) { audio.pause(); a.classList.remove('playing'); return; }
      audio = new Audio(au.blobUrl);
      audio.play();
      a.classList.add('playing');
      audio.onended = () => a.classList.remove('playing');
    });
    $el.appendChild(a);
  });
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeAttr(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
}

// ===== NAV =====
$btnPrev.addEventListener('click', () => {
  if (state.idx > 0) { state.idx--; save(); render(); }
});
$btnNext.addEventListener('click', () => {
  if (state.idx < TPS.length - 1) { state.idx++; save(); render(); }
});

document.getElementById('btn-pause').addEventListener('click', () => {

$pause.addEventListener('click', () => $pause.classList.remove('show'));

const $toc = document.getElementById('toc-overlay');
const $tocList = document.getElementById('toc-list');
function buildTOC() {
  $tocList.innerHTML = '';
  TPS.forEach((tp, i) => {
    const item = document.createElement('div');
    item.className = 'toc-item' + (i === state.idx ? ' current' : '');
    const hasNote = state.notes[tp.id] && (
      (state.notes[tp.id].text||'').trim().length > 0 ||
      (state.notes[tp.id].photos||[]).length > 0 ||
      (state.notes[tp.id].audios||[]).length > 0
    );
    if (hasNote) item.classList.add('has-note');
    item.innerHTML = `<span class="toc-time">${tp.time}</span><span class="toc-title">${tp.chip}</span>`;
    item.addEventListener('click', () => {
      state.idx = i; save(); render();
      $toc.classList.remove('show');
    });
    $tocList.appendChild(item);
  });
}
document.getElementById('btn-toc').addEventListener('click', () => { buildTOC(); $toc.classList.add('show'); });
document.getElementById('toc-close').addEventListener('click', () => $toc.classList.remove('show'));

// ===== EXPORT =====
const $exp = document.getElementById('export-overlay');
const $expText = document.getElementById('export-text');

function buildExport() {
  const lines = [];
  lines.push('# 一起看 · 首博「玉米·黄金·美洲豹」体验日志');
  lines.push('');
  lines.push('**日期**:2026-05-18');
  lines.push('**用户**:26 岁互联网 PM(新实例,与林知白同 cluster)');
  lines.push('**展览**:首博「玉米·黄金·美洲豹——玛雅与安第斯古代文明大展」');
  lines.push('');
  if (state.anchor.trim()) {
    lines.push('## Anchor(12:00 写下的画面)');
    lines.push('');
    lines.push('> ' + state.anchor.split('\n').join('\n> '));
    lines.push('');
  }
  lines.push('## 触点笔记');
  lines.push('');
  TPS.forEach((tp) => {
    const note = state.notes[tp.id];
    if (!note) return;
    const txt = (note.text || '').trim();
    const photos = (note.photos || []).length;
    const audios = (note.audios || []).length;
    if (!txt && !photos && !audios) return;
    lines.push(`### ${tp.time} · ${tp.chip}`);
    lines.push('');
    if (txt) { lines.push(txt); lines.push(''); }
    if (photos) lines.push(`*[${photos} 张照片附件,见原始数据]*`);
    if (audios) lines.push(`*[${audios} 段语音备忘,会话内可回放,关闭页面会丢失]*`);
    lines.push('');
  });

  lines.push('## 产品反馈(填写完事后给团队)');
  lines.push('');
  lines.push('1. **🤖 我开口** 9 个时刻里,哪几个 work / 哪几个让你出戏?');
  lines.push('   - ');
  lines.push('2. **节奏** 75/30/60/45/15 分钟分段对你的注意力曲线合适吗?');
  lines.push('   - ');
  lines.push('3. **强制中场休息**(13:30 离厅 30 min)有没有用?');
  lines.push('   - ');
  lines.push('4. **"不告诉我也行"** 那种放低姿态的措辞,你的真实感受是?');
  lines.push('   - ');
  lines.push('5. **"不要拍超过 10 张照片"** 这种硬约束,你接受吗?');
  lines.push('   - ');
  lines.push('6. **0 RAG 也能做同伴**——有没有让你觉得"产品其实不需要那么多数据"?');
  lines.push('   - ');
  lines.push('7. 任何一个"如果是我做产品我会做不一样"的点');
  lines.push('   - ');
  lines.push('8. 作为新实例,你今天与林知白 / 陈砚秋 / 周允 的差异如何 surface?');
  lines.push('   - ');
  lines.push('');
  lines.push('---');
  lines.push('');
  lines.push('生成时间:' + new Date().toLocaleString('zh-CN'));
  return lines.join('\n');
}
document.getElementById('btn-export').addEventListener('click', () => {
  $expText.value = buildExport();
  $exp.classList.add('show');
});
document.getElementById('export-close').addEventListener('click', () => $exp.classList.remove('show'));
document.getElementById('export-copy').addEventListener('click', () => {
  $expText.select();
  document.execCommand('copy');
  document.getElementById('export-copy').textContent = '✓ 已复制';
  setTimeout(() => document.getElementById('export-copy').textContent = '复制全文', 1500);
});
document.getElementById('export-download').addEventListener('click', () => {
  const blob = new Blob([$expText.value], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '首博-玛雅安第斯-体验日志-20260518.md';
  a.click();
  URL.revokeObjectURL(url);
});

// keyboard nav
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') $btnNext.click();
  if (e.key === 'ArrowLeft') $btnPrev.click();
  if (e.key === 'Escape') {
    $pause.classList.remove('show');
    $toc.classList.remove('show');
    $exp.classList.remove('show');
  }
});

render();
})();
</script>
