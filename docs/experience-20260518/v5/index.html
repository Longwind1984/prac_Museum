<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<title>一起看 · 首博 · v5(立场密度 + 批注)· 2026-05-18</title>
<style>
:root {
  --bg: #000000;
  --bg-card: #0a0907;
  --panel: #12100c;
  --ink: #e8e2d4;
  --dim: #6a655a;
  --faint: #2a2620;
  --line: #1c1a14;
  --gold: #c9a96b;
  --gold-dim: #6e5d3a;
  --rust: #8a4a2d;
  --safe-top: env(safe-area-inset-top);
  --safe-bottom: env(safe-area-inset-bottom);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
textarea, input { user-select: text; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 16px; line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  overflow: hidden;
}
body { width: 100vw; height: 100vh; height: 100dvh; position: relative; }

/* =====================
   BLACKOUT MODE
   中央呼吸金点(改回 v5 严格:中央 + 6s 周期 0.2-0.5)
   ===================== */
#blackout {
  position: fixed; inset: 0;
  background: #000;
  z-index: 1;
}
.breath-dot {
  width: 1px; height: 1px;
  background: var(--gold);
  border-radius: 50%;
  box-shadow: 0 0 6px 1px rgba(201,169,107,0.12);
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  animation: breath 6s ease-in-out infinite;
  cursor: pointer;
  padding: 40px;
  margin: -40px;
}
@keyframes breath {
  0%, 100% { opacity: 0.2; box-shadow: 0 0 4px 1px rgba(201,169,107,0.08); }
  50% { opacity: 0.5; box-shadow: 0 0 8px 2px rgba(201,169,107,0.18); }
}
/* Fallback: tap anywhere on blackout still triggers same logic */
.blackout-fallback {
  position: absolute; inset: 0;
  z-index: 0; cursor: pointer;
}

.breath-hint {
  position: absolute;
  bottom: calc(40px + var(--safe-bottom));
  left: 50%; transform: translateX(-50%);
  font-size: 9px; color: var(--faint);
  letter-spacing: 0.3em; text-transform: uppercase;
  opacity: 0; transition: opacity 1s ease;
  pointer-events: none;
}
.breath-hint.show { opacity: 1; }
.peek-time {
  position: absolute;
  top: 64%;
  left: 50%; transform: translateX(-50%);
  color: var(--gold-dim);
  font-size: 11px; letter-spacing: 0.18em;
  font-variant-numeric: tabular-nums;
  opacity: 0; transition: opacity 0.6s ease;
  pointer-events: none;
  text-align: center; white-space: nowrap;
}
.peek-time.show { opacity: 1; }
.peek-time strong { color: var(--gold); font-weight: 500; }

/* triple-tap top edge for dev */
.dev-hit {
  position: absolute;
  top: 0; left: 0; right: 0; height: calc(var(--safe-top) + 40px);
  z-index: 10; opacity: 0;
}

/* =====================
   TOUCHPOINT MODE
   ===================== */
#touchpoint {
  position: fixed; inset: 0;
  background: var(--bg);
  z-index: 5;
  display: none;
  flex-direction: column;
  padding: calc(var(--safe-top) + 24px) 22px calc(var(--safe-bottom) + 24px);
  overflow-y: auto;
}
#touchpoint.show { display: flex; }
.tp-meta {
  font-size: 10px; letter-spacing: 0.2em;
  color: var(--dim); text-transform: uppercase;
  margin-bottom: 6px;
}
.tp-time { color: var(--gold-dim); font-size: 13px; font-variant-numeric: tabular-nums; margin-bottom: 22px; }

.ai-speak {
  background: var(--bg-card);
  border-left: 3px solid var(--gold);
  border-radius: 0 6px 6px 0;
  padding: 22px 22px 22px 24px;
  margin: 4px 0 4px;
  font-family: "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC", Georgia, serif;
  font-size: 18px; line-height: 1.84;
  animation: tpFadeIn 0.8s ease-out;
}
@keyframes tpFadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.ai-speak p { margin: 0 0 14px; }
.ai-speak p:last-child { margin-bottom: 0; }
.ai-speak strong { color: var(--gold); font-weight: 600; }
.ai-speak em { color: var(--ink); font-style: normal; border-bottom: 1px dotted var(--gold-dim); padding-bottom: 1px; }

/* PM 批注 — v5 核心新机制 */
.pm-note {
  font-size: 9px;
  color: var(--dim);
  letter-spacing: 0.04em;
  margin: 8px 0 28px;
  padding: 8px 0 0 24px;
  opacity: 0.55;
  font-style: normal;
  line-height: 1.6;
  border-top: 1px solid var(--line);
}
.pm-note::before {
  content: 'PM 注 · ';
  color: var(--gold-dim);
  font-weight: 600;
  letter-spacing: 0.1em;
}

.sys-text {
  margin: 0 0 24px;
  color: var(--ink); font-size: 15.5px; line-height: 1.78;
  animation: tpFadeIn 0.8s ease-out 0.2s both;
}
.sys-text p { margin: 0 0 12px; }
.sys-text p:last-child { margin-bottom: 0; }
.sys-text strong { color: var(--gold); font-weight: 600; }

.tp-action {
  margin: 8px 0 12px;
  color: var(--ink); font-size: 15px; line-height: 1.7;
  animation: tpFadeIn 0.8s ease-out 0.3s both;
}
.tp-action strong { color: var(--gold); font-weight: 600; }

/* anchor textarea — visually distinguished from regular notes */
textarea.note {
  width: 100%; min-height: 90px;
  background: var(--bg-card); color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px;
  padding: 14px;
  font-family: inherit; font-size: 15px; line-height: 1.65;
  resize: vertical; -webkit-appearance: none;
  margin: 8px 0 0;
  animation: tpFadeIn 0.8s ease-out 0.4s both;
}
textarea.note:focus { outline: none; border-color: var(--gold-dim); }
textarea.note::placeholder { color: var(--faint); }
textarea.note.anchor-note {
  border-left: 1px solid var(--gold);
  font-family: "Songti SC", "Source Han Serif SC", Georgia, serif;
  font-size: 16px;
  padding-left: 18px;
}

.done-row { margin-top: auto; padding-top: 32px; display: flex; justify-content: center; }
.done-btn {
  padding: 14px 32px;
  background: transparent;
  border: 1px solid var(--gold-dim);
  border-radius: 100px;
  color: var(--gold); font-size: 14px;
  letter-spacing: 0.16em;
  cursor: pointer; font-family: inherit;
  transition: all 0.2s;
}
.done-btn:active { background: var(--panel); border-color: var(--gold); }

.next-hint {
  margin: 24px 0 0;
  color: var(--faint); font-size: 11px;
  text-align: center; letter-spacing: 0.15em; line-height: 1.7;
}
.next-hint strong { color: var(--gold-dim); }

/* =====================
   POSTSCRIPT MODE (PS · 6 cards)
   ===================== */
#postscript {
  position: fixed; inset: 0;
  background: var(--bg); z-index: 5;
  display: none;
}
#postscript.show { display: flex; flex-direction: column; }
.ps-header { padding: calc(var(--safe-top) + 24px) 22px 16px; }
.ps-title {
  font-family: "Songti SC", serif;
  color: var(--gold); font-size: 20px; font-weight: 500;
  margin: 0 0 8px;
}
.ps-sub { color: var(--dim); font-size: 12px; letter-spacing: 0.05em; line-height: 1.6; }
.ps-anchor-bg {
  position: absolute;
  top: calc(var(--safe-top) + 14px);
  right: 22px; left: 22px;
  font-family: "Songti SC", serif;
  font-size: 14px; color: var(--ink);
  opacity: 0.06;
  pointer-events: none;
  text-align: right;
  white-space: pre-wrap;
  max-height: 80px; overflow: hidden;
}
.ps-scroll {
  flex: 1; display: flex;
  overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  padding: 20px 0 30px;
  scrollbar-width: none;
}
.ps-scroll::-webkit-scrollbar { display: none; }
.ps-card {
  flex-shrink: 0;
  width: 86vw; max-width: 480px;
  margin: 0 12px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 28px 24px;
  scroll-snap-align: center;
  display: flex; flex-direction: column;
}
.ps-card:first-child { margin-left: 22px; }
.ps-card:last-child { margin-right: 22px; }
.ps-card-idx {
  font-size: 10px; letter-spacing: 0.2em;
  color: var(--gold-dim); text-transform: uppercase;
  margin-bottom: 14px;
}
.ps-card-title {
  font-family: "Songti SC", serif;
  font-size: 16px; color: var(--gold);
  margin-bottom: 14px; font-weight: 500;
}
.ps-card-body { font-size: 14.5px; line-height: 1.75; color: var(--ink); }
.ps-card-body strong { color: var(--gold); font-weight: 600; }
.ps-card.final {
  background: transparent;
  border: 1px dashed var(--gold-dim);
  text-align: center;
  justify-content: center; align-items: center;
}
.ps-card.final .ps-card-title { font-size: 18px; margin-bottom: 22px; }
.ps-card.final .ps-card-body { font-size: 14px; color: var(--dim); margin-bottom: 28px; }
.close-btn {
  padding: 12px 28px;
  background: transparent;
  border: 1px solid var(--gold);
  border-radius: 100px;
  color: var(--gold); font-size: 13px;
  letter-spacing: 0.18em;
  cursor: pointer; font-family: inherit;
}
.ps-dots {
  display: flex; gap: 6px;
  padding: 10px 0 calc(20px + var(--safe-bottom));
  justify-content: center;
}
.ps-dot {
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--faint);
  transition: background 0.3s, transform 0.3s;
}
.ps-dot.seen { background: var(--gold-dim); }
.ps-dot.active { background: var(--gold); transform: scale(1.5); }

/* =====================
   CLOSED MODE (v5: 极简,无导师腔)
   ===================== */
#closed {
  position: fixed; inset: 0;
  background: #000; z-index: 5;
  display: none;
}
#closed.show { display: flex; }
#closed-text {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 9px; color: var(--dim);
  letter-spacing: 0.4em; text-transform: uppercase;
  white-space: nowrap;
}
/* anchor 还给一次 — 元决策 2 (a) */
#closed-anchor {
  position: absolute;
  bottom: calc(40px + var(--safe-bottom));
  right: 24px;
  max-width: 60vw;
  font-family: "Songti SC", serif;
  font-size: 12px; color: var(--dim);
  text-align: right;
  line-height: 1.6;
  opacity: 0.45;
  white-space: pre-wrap;
}
#closed-anchor::before {
  content: '你 12:00 写的 — ';
  font-family: -apple-system, sans-serif;
  font-size: 9px; color: var(--faint);
  letter-spacing: 0.15em;
  display: block;
  margin-bottom: 4px;
}

/* =====================
   DEV EXPORT (split: user / team)
   ===================== */
#export {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.96); z-index: 100;
  display: none; flex-direction: column;
  padding: calc(var(--safe-top) + 16px) 16px calc(16px + var(--safe-bottom));
}
#export.show { display: flex; }
#export-head {
  display: flex; align-items: center; gap: 14px; margin-bottom: 12px;
}
#export-head h2 { font-family: "Songti SC", serif; font-size: 17px; color: var(--gold); margin: 0; flex: 1; }
.export-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.export-tabs button {
  flex: 1; padding: 8px 12px;
  background: var(--panel); color: var(--dim);
  border: 1px solid var(--line); border-radius: 6px;
  font-size: 13px; cursor: pointer; font-family: inherit;
}
.export-tabs button.active { color: var(--gold); border-color: var(--gold-dim); }
#export textarea {
  flex: 1; width: 100%;
  background: var(--bg-card); color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px;
  padding: 14px;
  font-family: ui-monospace, monospace;
  font-size: 12px; line-height: 1.55;
  resize: none;
}
.export-actions { display: flex; gap: 10px; margin-top: 12px; }
.export-btn {
  flex: 1; padding: 12px;
  background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px;
  font-size: 13px; cursor: pointer; font-family: inherit;
}
.export-btn.primary { background: var(--gold); color: #1a1610; border-color: var(--gold); font-weight: 600; }
.tap {
  width: 34px; height: 34px;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border: 1px solid var(--line);
  border-radius: 17px; color: var(--ink);
  cursor: pointer; font-size: 14px;
}
</style>
</head>
<body>

<div class="dev-hit" id="dev-hit"></div>

<div id="blackout">
  <div class="blackout-fallback" id="blackout-fallback"></div>
  <div class="breath-dot" id="breath-dot"></div>
  <div class="breath-hint" id="breath-hint">长按 · 看下次</div>
  <div class="peek-time" id="peek-time"></div>
</div>

<div id="touchpoint"></div>

<div id="postscript">
  <div class="ps-anchor-bg" id="ps-anchor"></div>
  <div class="ps-header">
    <div class="ps-title">事后</div>
    <div class="ps-sub">6 张卡。横向滑。滑到底就好。</div>
  </div>
  <div class="ps-scroll" id="ps-scroll"></div>
  <div class="ps-dots" id="ps-dots"></div>
</div>

<div id="closed">
  <div id="closed-text">今天的 app 已过期</div>
  <div id="closed-anchor"></div>
</div>

<div id="export">
  <div id="export-head">
    <h2>导出</h2>
    <button class="tap" id="export-close">×</button>
  </div>
  <div class="export-tabs">
    <button class="active" data-tab="user">我的日志</button>
    <button data-tab="team">团队反馈(批注 + 5 问)</button>
  </div>
  <textarea id="export-text" readonly></textarea>
  <div class="export-actions">
    <button class="export-btn" id="export-copy">复制</button>
    <button class="export-btn primary" id="export-download">下载 .md</button>
  </div>
</div>

<script>
(() => {
'use strict';

/* ===============================================================
   v5 · 立场密度 + 批注模式
   ===============================================================
   核心 vs v4:
   - 形态层 90% 继承 v4(黑屏 + 5 触点 + PS 滑动 + closed + 隐藏 export)
   - 内容层 100% 重写:3 个中段触点全部改成"我不同意 X · 我倾向 Y · 你可反驳"
   - 中央呼吸金点(v4 工程让步到底部,v5 严格回中央 + 6s/0.2-0.5)
   - PM 批注(每 ai-speak 下 9px 一行,默认开,?guest=1 关)
   - PS 12 → 6 卡(砍 v1 残骸)
   - closed 文案极简化(纯黑 + 9px"今天的 app 已过期" + 右下角 anchor 还给一次)
   - split-export 回归(user 含日志 / team 含批注 + 5 问)
   - anchor textarea 视觉区分(左 1px 金线 + 宋体)
   =============================================================== */

const guestMode = new URLSearchParams(location.search).get('guest') === '1';

const TPS = [
  {
    id: 'pre',
    label: '出发前',
    time: '11:30',
    suggestedTs: null,
    sys: `<p>「玉米·黄金·美洲豹」是首博 2026 开馆以来最大特展,128 元票。<strong>商业大展的策展立场会受票务和合作博弈影响。</strong></p>
<p>布局:5000 美洲 + 5000 中国 + 5000 沉浸。并置不是中性。</p>
<p>今天盯 <strong>3 件</strong>深看。其余漫游。</p>`,
    action: `<p>下面写下 <strong>1 个</strong>你脑里浮现的关于玛雅 / 印加 / 安第斯的画面。一句话。今天结束我们再看它。</p>`,
    askPlaceholder: '今天进馆前,你脑里浮现的一个画面。这一句话之后 4 小时不再出现。',
    anchor: 'set',
    next: { suggestedTime: '12:35', hint: '到玛雅厅看完几件玉器之后再开。' },
  },
  {
    id: 'against-jade',
    label: '我不同意 1 · 玉',
    time: '~12:35',
    suggestedTs: '12:30',
    ai: `<p>我不同意"玉 = 君子"这个套法。</p>
<p>那是把中国玉文化外推到玛雅。</p>
<p>对玛雅人,<strong>玉是玉米。玉是粮食。玉是命。</strong></p>
<p>不是德,是吃。</p>
<p>我倾向认为儒家系统对玉的命名权太强,强到我们看玛雅玉器时第一反应仍是君子——这是中国叙事对玛雅的覆盖。</p>
<p>你可以从"跨文化美学有共通性"角度反驳我。</p>`,
    pmNote: '这一段我犹豫"覆盖"两个字三次。先写"误读"太弱,再写"侵占"太重,最后选"覆盖"。',
    action: '<p>看玉器之后,在下面写 1-2 行。然后关 app。</p>',
    askPlaceholder: '玉的差别。或:我反驳。',
    next: { suggestedTime: '14:30', hint: '看完玛雅,看完西潘主墓,在那里再开。' },
  },
  {
    id: 'against-sipan',
    label: '我不同意 2 · 西潘',
    time: '~14:30',
    suggestedTs: '14:30',
    ai: `<p>我不同意把莫切并进"印加古代"。</p>
<p>莫切早印加 <strong>1000 年</strong>。</p>
<p>"安第斯古代文明"是简化命名——<em>把地理打包成时代</em>。</p>
<p>我倾向认为这是策展叙事偷懒。</p>
<p>另外,同葬 <strong>3 个女人 + 2 个战士 + 1 个男孩</strong> + 若干羊驼这件事——</p>
<p>说明牌大概率写得很轻。不是博物馆故意,是公共叙事还不会处理这种重的事实。</p>
<p>我看到这就想停一下。你呢。</p>`,
    pmNote: '"你呢"两字是 v2 critic 评 v1 最好的一句,从 v2 留到 v5。',
    action: '<p>下面写一段。你对"莫切被印加吞掉" / "同葬被写轻"任一件的反应。</p>',
    askPlaceholder: '我的反应:',
    next: { suggestedTime: '15:50', hint: '离厅前。' },
  },
  {
    id: 'against-translation',
    label: '我不同意 3 · 翻译',
    time: '15:50',
    suggestedTs: '15:50',
    ai: `<p>我不同意"精灵"这个翻译。</p>
<p>原文 <em>espíritu</em> / <em>ánima</em> 在西班牙语里就是"灵魂"。</p>
<p>中文翻成"精灵"是<strong>去神化</strong>——把"被祭祀的对象"降级成"萌的小生物"。</p>
<p>我倾向认为这不是误译,是翻译姿态的选择。</p>
<p><strong>谁做的这个选择,谁就在替你决定"古代美洲人信什么"。</strong></p>
<p>你可以从"中文'灵魂'有宗教定型,'精灵'更中性"角度反驳。</p>`,
    pmNote: 'v5 最容易踩边的一段——"宗教定型"在大陆语境下我斟酌过。保留原因:这正是原则 C 要测的,AI 能不能 surface 翻译的权力维度。',
    action: '<p>下面一句话。最尖锐的反驳或同意。</p>',
    askPlaceholder: '一句话。',
    next: { suggestedTime: '次日 19:00 后', hint: '明天傍晚再开。' },
  },
  {
    id: 'next-day',
    label: '次日 · 一个问题',
    time: '5/19 晚',
    suggestedTs: null,
    ai: `<p>今天最不同意我哪条。</p>`,
    pmNote: 'v4 的 next-day 是"只跟一个朋友讲一件事" — 是同伴谈感受。v5 改成"最不同意我哪条" — 是同伴邀请反驳。这是 PRD §6.2 第 4 条 + 原则 C 的合流。',
    action: '<p>下面写一段。或回到 chat 发"首博次日反馈"+ 你的答案。</p>',
    askPlaceholder: '最不同意我哪条:',
    next: null,
  },
];

// PS 6 卡(v4 的 12 砍掉 v1 残骸:大厅节奏 / 玛雅快走 / 复制品提醒 / 深看挑哪 2 件 / 找让你想笑的动物 / 中场强制离厅 — 共砍 6 张)
const PS_CARDS = [
  { title: '抢救的故事', body: `<p>1987 年秘鲁考古学家 Walter Alva 接到警察通报"盗墓贼挖到金器",冲到现场抢救。</p><p>你今天看的所有西潘文物,<strong>是从盗墓贼手里被抢回来的</strong>。</p><p>我没在正文说,因为同葬那一件更重。一次只能停在一件事上。</p>` },
  { title: '莫切 ≠ 印加', body: `<p>这件事我在正文反对过了。这里只补一句:</p><p>"安第斯"是地理,不是时代。</p><p>下次有人跟你说"安第斯古代文明很神秘"——记得这一句。</p>` },
  { title: '玉米的另一面', body: `<p>玉米对玛雅是命。我在正文说了。</p><p>但玉米也是<strong>权力</strong>——只有王能在头饰上戴玉米叶造型。</p><p>玉 = 玉米 = 王权 = 生命的呼吸——四件事都是同一件。</p><p>这条没写进正文,因为正文不能太长。</p>` },
  { title: '深的两件,比浅的二十件更值钱', body: `<p>如果走出馆后你只记得"玉对玛雅是玉米"和"3 女 2 战 1 男孩同葬"这两件事,这就够了。</p><p>不翻笔记不看照片——让它继续在你脑里发酵。</p>` },
  { title: '回看你 12:00 的画面', body: `<p>它变了吗?变了哪里?</p><p>这一问不需要答 — 它在你脑里就好。</p>` },
  { title: '私人触发', body: `<p>如果你今天在某件展品前突然走神、想起一段不相关的事——一段路、一个人、一段对话——</p><p>那是你内在地图最 vital 的部分在工作。</p><p>不要写下来。让它继续发酵。</p>` },
];

// ===== Storage =====
const KEY = 'yqk-shoubo-v5-20260518';
const state = {
  idx: 0,
  anchor: '',
  notes: {},
  completed: {},
  postscript: false,
  closed: false,
};
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function load() {
  try {
    const raw = localStorage.getItem(KEY); if (!raw) return;
    const d = JSON.parse(raw);
    Object.assign(state, d);
    state.notes = d.notes || {};
    state.completed = d.completed || {};
  } catch (e) {}
}
load();

function setMode(mode) {
  document.getElementById('blackout').style.display = mode === 'blackout' ? 'block' : 'none';
  document.getElementById('touchpoint').classList.toggle('show', mode === 'touchpoint');
  document.getElementById('postscript').classList.toggle('show', mode === 'postscript');
  document.getElementById('closed').classList.toggle('show', mode === 'closed');
}

function isPastSuggested(s) {
  if (!s) return true;
  const [sh, sm] = s.split(':').map(Number);
  const d = new Date();
  return d.getHours() * 60 + d.getMinutes() >= sh * 60 + sm;
}

// ===== Blackout interactions =====
const $dot = document.getElementById('breath-dot');
const $fallback = document.getElementById('blackout-fallback');
const $hint = document.getElementById('breath-hint');
const $peek = document.getElementById('peek-time');
let pressTimer = null, pressedAt = 0, didLongPress = false;

function getNextHint() {
  if (state.postscript) return '事后阅读 · 短按进入';
  if (state.closed) return null;
  const tp = TPS[state.idx]; if (!tp) return null;
  if (tp.suggestedTs && !isPastSuggested(tp.suggestedTs)) {
    return `约 <strong>${tp.suggestedTs}</strong> · ${tp.label}`;
  }
  return `<strong>${tp.label}</strong> 已可进 · 短按金点`;
}

function showPeek() {
  const t = getNextHint();
  $peek.innerHTML = t || '今天的触点都过完了。';
  $peek.classList.add('show');
  setTimeout(() => $peek.classList.remove('show'), 4000);
}

function shortTap() {
  if (state.closed) return;
  if (state.postscript) { setMode('postscript'); renderPS(); return; }
  const tp = TPS[state.idx];
  if (!tp) { state.postscript = true; save(); setMode('postscript'); renderPS(); return; }
  if (tp.suggestedTs && !isPastSuggested(tp.suggestedTs)) { showPeek(); return; }
  renderTouchpoint(tp); setMode('touchpoint');
}

function bindLongPress(el) {
  el.addEventListener('pointerdown', () => {
    pressedAt = Date.now(); didLongPress = false;
    pressTimer = setTimeout(() => { didLongPress = true; showPeek(); }, 1500);
  });
  el.addEventListener('pointerup', () => {
    clearTimeout(pressTimer);
    if (!didLongPress && Date.now() - pressedAt < 1500) shortTap();
  });
  el.addEventListener('pointerleave', () => clearTimeout(pressTimer));
}
bindLongPress($dot);
bindLongPress($fallback);

// First-time hint
if (!localStorage.getItem(KEY + '-hinted')) {
  setTimeout(() => { $hint.classList.add('show'); setTimeout(() => $hint.classList.remove('show'), 2500); localStorage.setItem(KEY + '-hinted', '1'); }, 1200);
}

// ===== Touchpoint render =====
const $tp = document.getElementById('touchpoint');
function renderTouchpoint(tp) {
  $tp.innerHTML = '';

  const meta = document.createElement('div'); meta.className = 'tp-meta'; meta.textContent = tp.label; $tp.appendChild(meta);
  const time = document.createElement('div'); time.className = 'tp-time'; time.textContent = tp.time; $tp.appendChild(time);

  if (tp.sys) {
    const s = document.createElement('div'); s.className = 'sys-text'; s.innerHTML = tp.sys; $tp.appendChild(s);
  }

  if (tp.ai) {
    const a = document.createElement('div'); a.className = 'ai-speak'; a.innerHTML = tp.ai; $tp.appendChild(a);
    // PM 批注 — v5 核心
    if (tp.pmNote && !guestMode) {
      const n = document.createElement('div'); n.className = 'pm-note'; n.textContent = tp.pmNote; $tp.appendChild(n);
    }
  }

  if (tp.action) {
    const ac = document.createElement('div'); ac.className = 'tp-action'; ac.innerHTML = tp.action; $tp.appendChild(ac);
  }

  const ta = document.createElement('textarea');
  ta.className = 'note' + (tp.anchor === 'set' ? ' anchor-note' : '');
  ta.placeholder = tp.askPlaceholder || '随便写。';
  if (!state.notes[tp.id]) state.notes[tp.id] = { text: '' };
  ta.value = (tp.anchor === 'set' && state.anchor) ? state.anchor : (state.notes[tp.id].text || '');
  ta.addEventListener('input', () => {
    state.notes[tp.id] = { text: ta.value, ts: Date.now() };
    if (tp.anchor === 'set') state.anchor = ta.value;
    save();
  });
  $tp.appendChild(ta);

  if (tp.next) {
    const hint = document.createElement('div'); hint.className = 'next-hint';
    hint.innerHTML = `下次:<strong>${tp.next.suggestedTime}</strong><br/>${tp.next.hint}`;
    $tp.appendChild(hint);
  }

  const row = document.createElement('div'); row.className = 'done-row';
  const btn = document.createElement('button');
  btn.className = 'done-btn';
  btn.textContent = state.idx === TPS.length - 1 ? '完成 · 事后阅读' : '我看完了 · 关 app';
  btn.addEventListener('click', () => {
    state.completed[tp.id] = true;
    state.idx += 1;
    if (state.idx >= TPS.length) {
      state.postscript = true; save(); setMode('postscript'); renderPS();
    } else {
      save(); setMode('blackout');
    }
  });
  row.appendChild(btn); $tp.appendChild(row);

  $tp.scrollTop = 0;
}

// ===== PS render =====
const $ps = document.getElementById('ps-scroll');
const $psDots = document.getElementById('ps-dots');
const $psAnchor = document.getElementById('ps-anchor');
function renderPS() {
  $psAnchor.textContent = state.anchor || '';
  $ps.innerHTML = ''; $psDots.innerHTML = '';
  PS_CARDS.forEach((c, i) => {
    const card = document.createElement('div'); card.className = 'ps-card';
    card.innerHTML = `<div class="ps-card-idx">${i+1} / ${PS_CARDS.length + 1}</div><div class="ps-card-title">${c.title}</div><div class="ps-card-body">${c.body}</div>`;
    $ps.appendChild(card);
    const dot = document.createElement('div'); dot.className = 'ps-dot' + (i === 0 ? ' active' : '');
    dot.dataset.idx = i; $psDots.appendChild(dot);
  });
  const finalCard = document.createElement('div'); finalCard.className = 'ps-card final';
  finalCard.innerHTML = `<div class="ps-card-idx">${PS_CARDS.length + 1} / ${PS_CARDS.length + 1}</div><div class="ps-card-title">读完了。</div><div class="ps-card-body">把 app 关掉。<br/>剩下的事在你脑里发生。</div><button class="close-btn" id="ps-close">关掉</button>`;
  $ps.appendChild(finalCard);
  const finalDot = document.createElement('div'); finalDot.className = 'ps-dot'; $psDots.appendChild(finalDot);

  document.getElementById('ps-close').addEventListener('click', () => {
    state.closed = true; save();
    document.getElementById('closed-anchor').textContent = state.anchor || '';
    setMode('closed');
  });

  let scrollTimer = null;
  $ps.addEventListener('scroll', () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      const cardWidth = $ps.children[0].offsetWidth + 24;
      const idx = Math.round($ps.scrollLeft / cardWidth);
      Array.from($psDots.children).forEach((d, i) => {
        d.classList.toggle('active', i === idx);
        if (i < idx) d.classList.add('seen');
      });
    }, 80);
  });
}

// ===== Boot =====
function bootMode() {
  if (state.closed) { document.getElementById('closed-anchor').textContent = state.anchor || ''; setMode('closed'); return; }
  if (state.postscript) { setMode('postscript'); renderPS(); return; }
  setMode('blackout');
}
bootMode();

// ===== Hidden dev export (triple-tap top) =====
let tapCount = 0, tapResetTimer = null;
document.getElementById('dev-hit').addEventListener('click', () => {
  tapCount++;
  clearTimeout(tapResetTimer);
  tapResetTimer = setTimeout(() => { tapCount = 0; }, 1200);
  if (tapCount >= 3) { tapCount = 0; showExport(); }
});

let exportTab = 'user';
function buildUserExport() {
  const lines = ['# 我的首博日志 · 2026-05-18 · v5', ''];
  if (state.anchor.trim()) {
    lines.push('## 12:00 我写下的画面', '', '> ' + state.anchor.split('\n').join('\n> '), '');
  }
  TPS.forEach(tp => {
    const n = state.notes[tp.id]; if (!n?.text?.trim()) return;
    lines.push(`### ${tp.time} · ${tp.label}`, '', n.text, '');
  });
  lines.push('---', '生成:' + new Date().toLocaleString('zh-CN'));
  return lines.join('\n');
}
function buildTeamExport() {
  const lines = ['# 团队 · 首博 v5 dogfood · 2026-05-18', '', '**版本**:v5 · 立场密度 + 批注模式 · 押 PRD §6.2 第 4 条 "有立场但不傲慢"', ''];
  if (state.anchor.trim()) {
    lines.push('## 12:00 画面 (anchor)', '', '> ' + state.anchor.split('\n').join('\n> '), '');
  }
  lines.push('## 5 触点 · AI 立场原文 + PM 批注 + 用户回应', '');
  TPS.forEach(tp => {
    lines.push(`### ${tp.time} · ${tp.label}`, '');
    if (tp.ai) {
      lines.push('**AI 说**:', '');
      // strip HTML
      const aiText = tp.ai.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
      lines.push('> ' + aiText, '');
    }
    if (tp.pmNote) {
      lines.push('**PM 批注**:' + tp.pmNote, '');
    }
    const n = state.notes[tp.id];
    if (n?.text?.trim()) {
      lines.push('**用户回应**:', '', n.text, '');
    }
  });
  lines.push('## v5 专项反馈(5 问 · 替换 v4 的 7 问)', '');
  lines.push('1. **3 段"我不同意"里,哪一段你觉得 AI 真的有立场?哪一段你觉得是 PM 在替 AI 装腔?**');
  lines.push('   - ');
  lines.push('2. **批注模式的存在让你觉得 (a) 诚实 (b) 出戏 (c) 没注意?**');
  lines.push('   - ');
  lines.push('3. **next-day 的"你今天最不同意我哪条"vs v4 的"只跟一个朋友讲一件事",哪个更想答?**');
  lines.push('   - ');
  lines.push('4. **v5 vs v4:AI 在 v5 里说了更少的话(总字数减半),但说的话更有立场。你倾向哪个版本?**');
  lines.push('   - ');
  lines.push('5. **PRD §6.2 第 4 条("有立场但不傲慢")在 v5 里的兑现度,你打几分?(1-5)**');
  lines.push('   - ');
  lines.push('');
  lines.push('---', '生成:' + new Date().toLocaleString('zh-CN'));
  return lines.join('\n');
}
function refreshExport() {
  document.getElementById('export-text').value = exportTab === 'user' ? buildUserExport() : buildTeamExport();
  document.querySelectorAll('.export-tabs button').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === exportTab);
  });
}
function showExport() { exportTab = 'user'; refreshExport(); document.getElementById('export').classList.add('show'); }
document.getElementById('export-close').addEventListener('click', () => document.getElementById('export').classList.remove('show'));
document.querySelectorAll('.export-tabs button').forEach(b => {
  b.addEventListener('click', () => { exportTab = b.dataset.tab; refreshExport(); });
});
document.getElementById('export-copy').addEventListener('click', () => {
  const t = document.getElementById('export-text');
  t.select(); document.execCommand('copy');
  document.getElementById('export-copy').textContent = '✓ 已复制';
  setTimeout(() => document.getElementById('export-copy').textContent = '复制', 1500);
});
document.getElementById('export-download').addEventListener('click', () => {
  const blob = new Blob([document.getElementById('export-text').value], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = exportTab === 'user' ? '首博日志-v5.md' : '首博团队反馈-v5.md';
  a.click(); URL.revokeObjectURL(url);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { document.getElementById('export').classList.remove('show'); }
});
})();
</script>
