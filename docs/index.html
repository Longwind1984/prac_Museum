<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>一起看 · 中国艺术 CC0/PD 图鉴</title>
  <style>
    :root {
      --bg: #0c0c10;
      --panel: #15151b;
      --ink: #e8e8ee;
      --dim: #8a8a96;
      --accent: #d6c094;
      --accent-2: #6f6448;
      --line: #25252e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
    header { padding: 24px 24px 12px; border-bottom: 1px solid var(--line); }
    h1 { font-size: 20px; margin: 0; font-weight: 600; letter-spacing: 0.5px; }
    .sub { color: var(--dim); font-size: 13px; margin-top: 4px; }
    .filters { padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; position: sticky; top: 0; z-index: 10; }
    .filters label { font-size: 12px; color: var(--dim); }
    .filters select, .filters input { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; font-size: 13px; font-family: inherit; }
    .filters input[type=search] { min-width: 200px; }
    .stats { color: var(--dim); font-size: 12px; margin-left: auto; }
    main { padding: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; cursor: pointer; transition: transform 0.15s ease, border-color 0.15s ease; }
    .card:hover { transform: translateY(-2px); border-color: var(--accent-2); }
    .card img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: #1f1f28; }
    .card .meta { padding: 8px 10px 10px; }
    .card .title { font-size: 13px; line-height: 1.3; margin-bottom: 3px; max-height: 2.6em; overflow: hidden; }
    .card .dynasty { color: var(--accent); font-size: 11px; }
    .card .src { color: var(--dim); font-size: 10px; margin-top: 2px; }
    .card.no-img { aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 12px; }
    .card.no-img .nomark { color: var(--dim); font-size: 11px; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); padding: 24px; z-index: 100; overflow-y: auto; }
    .modal.open { display: flex; align-items: flex-start; justify-content: center; }
    .modal-inner { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; max-width: 880px; width: 100%; padding: 22px; }
    .modal-inner h2 { margin: 0 0 4px; font-size: 18px; }
    .modal-inner .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 14px; }
    .modal-inner img { width: 100%; border-radius: 4px; background: var(--bg); }
    .modal-inner dl { margin: 0; font-size: 13px; line-height: 1.55; }
    .modal-inner dt { color: var(--dim); margin-top: 6px; font-weight: normal; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    .modal-inner dd { margin: 0; }
    .modal-inner a { color: var(--accent); text-decoration: none; }
    .modal-inner a:hover { text-decoration: underline; }
    .modal-close { float: right; cursor: pointer; color: var(--dim); font-size: 22px; line-height: 1; }
    .pager { display: flex; justify-content: center; gap: 8px; padding: 18px; }
    .pager button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); padding: 6px 12px; cursor: pointer; border-radius: 4px; font-family: inherit; }
    .pager button:disabled { opacity: 0.4; cursor: not-allowed; }
    .pager button:hover:not(:disabled) { border-color: var(--accent-2); }
    .loading { padding: 60px; text-align: center; color: var(--dim); }
    @media (max-width: 600px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .modal-inner .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>一起看 · 中国艺术 CC0/PD 图鉴</h1>
    <div class="sub" id="sub">加载中…</div>
  </header>
  <div class="filters">
    <label>朝代:<select id="f-dynasty"><option value="">全部</option></select></label>
    <label>源:<select id="f-source">
      <option value="">全部</option>
      <option value="cma">Cleveland (CMA)</option>
      <option value="met">The Met</option>
      <option value="smithsonian_fsg">Freer/Sackler (FSG)</option>
    </select></label>
    <label>材质:<input type="text" id="f-material" placeholder="如 limestone / 青铜" /></label>
    <label>搜索:<input type="search" id="f-q" placeholder="title / desc / accession" /></label>
    <label><input type="checkbox" id="f-img" checked /> 仅显示有图</label>
    <span class="stats" id="stats">—</span>
  </div>
  <main>
    <div id="grid" class="grid"><div class="loading">加载 chunks…</div></div>
    <div class="pager">
      <button id="prev" disabled>← 上一页</button>
      <span id="page-info" style="align-self:center;color:var(--dim);font-size:13px;">—</span>
      <button id="next" disabled>下一页 →</button>
    </div>
  </main>
  <div class="modal" id="modal"><div class="modal-inner" id="modal-inner"></div></div>
  <script src="app.js"></script>
</body>
</html>
